<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>LinkPay Pro - Gestão & Cobrança</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinkPay">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    input, select, button { -webkit-tap-highlight-color: transparent; }
    .touch-target { min-height: 48px; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">

  <!-- 1. TELA DE LOGIN -->
  <div id="loginScreen" class="fixed inset-0 z-40 bg-slate-950 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
      <div class="text-center space-y-2">
        <div class="w-14 h-14 bg-emerald-500/10 text-emerald-400 rounded-2xl border border-emerald-500/20 flex items-center justify-center mx-auto">
          <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-black tracking-tight text-white">LinkPay Pro</h2>
        <p class="text-xs text-slate-400">Servidor Online em Nuvem</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Usuário</label>
          <input 
            type="text" 
            id="loginUser" 
            required 
            placeholder="henrique ou master" 
            autocomplete="username"
            autocapitalize="none"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 touch-target text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-base"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Senha de Acesso</label>
          <input 
            type="password" 
            id="loginPass" 
            required 
            placeholder="••••••" 
            autocomplete="current-password"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 touch-target text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-base"
          >
        </div>

        <p id="loginError" class="hidden text-xs text-rose-400 text-center font-semibold"></p>

        <button 
          type="submit" 
          id="btnLoginSubmit"
          class="w-full touch-target bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] transition-all text-slate-950 font-black rounded-xl text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/25">
          <i data-lucide="lock-open" class="w-5 h-5"></i>
          <span>Entrar no Sistema</span>
        </button>
      </form>
    </div>
  </div>

  <!-- 2. PAINEL MASTER (ADMINISTRADOR) -->
  <div id="masterContainer" class="hidden pb-24">
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
      <div class="max-w-md mx-auto flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
            <i data-lucide="crown" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight leading-none text-white">Painel Master</h1>
            <span class="text-xs text-amber-400 font-medium">Servidor Online</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="handleLogout()" class="touch-target bg-slate-800/80 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 px-3 rounded-xl flex items-center gap-1 border border-slate-700 text-xs transition-all">
            <i data-lucide="log-out" class="w-4 h-4"></i> Sair
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
      <div class="flex items-center justify-between pt-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Provedores Conectados à Nuvem</h2>
      </div>
      <section id="masterTenantsList" class="space-y-3"></section>
    </main>
  </div>

  <!-- 3. PAINEL DO PROVEDOR -->
  <div id="appContainer" class="hidden pb-24">
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
      <div class="max-w-md mx-auto flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
            <i data-lucide="wifi" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 id="tenantNameHeader" class="text-lg font-bold tracking-tight leading-none text-white">LinkPay</h1>
            <span class="text-xs text-emerald-400 font-medium">Nuvem Ativa</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="handleLogout()" class="touch-target bg-slate-800/80 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 px-2 rounded-xl flex items-center gap-1 border border-slate-700 text-xs transition-all">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
          <button onclick="openModal()" class="touch-target bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition-all text-slate-950 font-bold px-3 rounded-xl flex items-center gap-1 shadow-lg shadow-emerald-500/20 text-sm">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Novo</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
      <section class="grid grid-cols-3 gap-2.5">
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-2.5 text-center">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 block">Clientes</span>
          <span id="counterTotal" class="text-xl font-black text-white">0</span>
        </div>
        <div class="bg-slate-900 border border-emerald-500/20 rounded-2xl p-2.5 text-center bg-emerald-950/10">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-emerald-400 block">Em Dia</span>
          <span id="counterPaid" class="text-xl font-black text-emerald-400">0</span>
        </div>
        <div class="bg-slate-900 border border-rose-500/20 rounded-2xl p-2.5 text-center bg-rose-950/10">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-rose-400 block">Atrasados</span>
          <span id="counterPending" class="text-xl font-black text-rose-400">0</span>
        </div>
      </section>

      <!-- Lista de Clientes -->
      <section id="clientsList" class="space-y-3 pt-1"></section>

      <div id="emptyState" class="hidden text-center py-12 px-4 space-y-3">
        <p class="text-slate-400 font-medium text-sm">Nenhum cliente cadastrado ainda no banco de dados.</p>
        <button onclick="openModal()" class="px-4 py-2 bg-emerald-500/20 text-emerald-400 rounded-xl text-xs font-bold border border-emerald-500/30">
          + Cadastrar Primeiro Cliente
        </button>
      </div>
    </main>
  </div>

  <!-- MODAL: NOVO CLIENTE -->
  <div id="clientModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl p-6 max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="user-plus" class="w-5 h-5 text-emerald-400"></i> Adicionar Cliente
        </h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800/50">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="clientForm" onsubmit="saveClient(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nome *</label>
          <input type="text" id="clientName" required placeholder="Ex: João da Silva" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 touch-target text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-base">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Plano *</label>
            <select id="clientPlan" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 touch-target text-slate-100 focus:outline-none focus:border-emerald-500 text-base">
              <option value="100 Mega">100 Mega</option>
              <option value="200 Mega">200 Mega</option>
              <option value="300 Mega" selected>300 Mega</option>
              <option value="400 Mega">400 Mega</option>
              <option value="500 Mega">500 Mega</option>
              <option value="600 Mega">600 Mega</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Valor (R$) *</label>
            <input type="number" id="clientPrice" step="0.01" min="0" required placeholder="89.90" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 touch-target text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-base">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Dia Vencimento *</label>
            <input type="number" id="clientDueDay" min="1" max="31" required placeholder="10" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 touch-target text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-base">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">WhatsApp</label>
            <input type="tel" id="clientPhone" placeholder="11987654321" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 touch-target text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-base">
          </div>
        </div>

        <div class="pt-3">
          <button type="submit" id="btnSaveClient" class="w-full touch-target bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] transition-all text-slate-950 font-bold rounded-xl text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
            <i data-lucide="check" class="w-5 h-5"></i> Salvar na Nuvem
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ⭐️ URL DO SEU BACKEND PYTHON NO RENDER
    const API_BASE_URL = "https://netmanager-4fhg.onrender.com";

    let authToken = localStorage.getItem("linkpay_token") || null;
    let authRole = localStorage.getItem("linkpay_role") || null;
    let authUser = localStorage.getItem("linkpay_user") || null;
    let authName = localStorage.getItem("linkpay_name") || null;

    function safeCreateIcons() {
      try {
        if (window.lucide && typeof lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {}
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const user = document.getElementById("loginUser").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value.trim();
      const errEl = document.getElementById("loginError");
      const btnSubmit = document.getElementById("btnLoginSubmit");

      errEl.classList.add("hidden");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = "<span>Conectando à nuvem...</span>";

      try {
        const response = await fetch(`${API_BASE_URL}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user, password: pass })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erro ao conectar");
        }

        authToken = data.token;
        authRole = data.role;
        authUser = data.user;
        authName = data.name;

        localStorage.setItem("linkpay_token", authToken);
        localStorage.setItem("linkpay_role", authRole);
        localStorage.setItem("linkpay_user", authUser);
        localStorage.setItem("linkpay_name", authName);

        checkAuth();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i data-lucide="lock-open" class="w-5 h-5"></i><span>Entrar no Sistema</span>';
        safeCreateIcons();
      }
    }

    function handleLogout() {
      localStorage.clear();
      authToken = null;
      authRole = null;
      authUser = null;
      checkAuth();
    }

    function checkAuth() {
      const loginScreen = document.getElementById("loginScreen");
      const masterContainer = document.getElementById("masterContainer");
      const appContainer = document.getElementById("appContainer");

      loginScreen.classList.add("hidden");
      masterContainer.classList.add("hidden");
      appContainer.classList.add("hidden");

      if (authRole === "master" && authToken) {
        masterContainer.classList.remove("hidden");
        loadMasterTenants();
      } else if (authRole === "tenant" && authToken) {
        appContainer.classList.remove("hidden");
        document.getElementById("tenantNameHeader").textContent = authName || "LinkPay";
        loadClients();
      } else {
        loginScreen.classList.remove("hidden");
      }
      safeCreateIcons();
    }

    async function loadMasterTenants() {
      const container = document.getElementById("masterTenantsList");
      container.innerHTML = '<p class="text-xs text-slate-400">Carregando da nuvem...</p>';

      try {
        const res = await fetch(`${API_BASE_URL}/api/master/tenants`, {
          headers: { "Authorization": `Bearer ${authToken}` }
        });
        const tenants = await res.json();
        container.innerHTML = "";

        tenants.forEach(t => {
          const card = document.createElement("div");
          card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2";
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-white">${t.name}</h3>
              <span class="text-xs text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded-md">Ativo</span>
            </div>
            <p class="text-xs text-slate-400">Usuário: <strong class="text-white">${t.username}</strong> • Senha: <span class="text-amber-400">${t.password}</span></p>
            <p class="text-xs text-slate-400">Vencimento Licença: Dia ${t.due_day} • R$ ${t.fee}</p>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p class="text-xs text-rose-400">Erro ao carregar provedores.</p>';
      }
      safeCreateIcons();
    }

    async function loadClients() {
      const container = document.getElementById("clientsList");
      const emptyState = document.getElementById("emptyState");
      container.innerHTML = '<p class="text-xs text-slate-400">Sincronizando com o servidor...</p>';

      try {
        const res = await fetch(`${API_BASE_URL}/api/clients`, {
          headers: { "Authorization": `Bearer ${authToken}` }
        });
        const clients = await res.json();
        container.innerHTML = "";

        if (clients.length === 0) {
          emptyState.classList.remove("hidden");
        } else {
          emptyState.classList.add("hidden");
        }

        let paidCount = 0;
        let pendingCount = 0;

        clients.forEach(c => {
          if (c.status === "paid") paidCount++;
          else pendingCount++;

          const isPaid = c.status === "paid";
          const card = document.createElement("div");
          card.className = `bg-slate-900 border ${isPaid ? 'border-slate-800' : 'border-amber-500/50'} rounded-2xl p-4 space-y-3`;
          card.innerHTML = `
            <div class="flex items-start justify-between">
              <div>
                <h3 class="font-bold text-base text-white">${c.name}</h3>
                <p class="text-xs text-slate-400">${c.plan} • R$ ${parseFloat(c.price).toFixed(2)}</p>
              </div>
              <span class="text-xs ${isPaid ? 'text-emerald-400' : 'text-amber-400 font-bold'}">Vence Dia ${c.due_day}</span>
            </div>
            <button onclick="toggleClientStatus('${c.id}')" class="w-full touch-target rounded-xl font-bold text-xs uppercase flex items-center justify-center gap-1.5 ${isPaid ? 'bg-emerald-600 text-white' : 'bg-amber-600 text-white'}">
              <i data-lucide="${isPaid ? 'check-circle' : 'clock'}" class="w-4 h-4"></i>
              ${isPaid ? 'PAGO' : 'PENDENTE'}
            </button>
          `;
          container.appendChild(card);
        });

        document.getElementById("counterTotal").textContent = clients.length;
        document.getElementById("counterPaid").textContent = paidCount;
        document.getElementById("counterPending").textContent = pendingCount;
      } catch (err) {
        container.innerHTML = '<p class="text-xs text-rose-400">Erro ao sincronizar clientes.</p>';
      }
      safeCreateIcons();
    }

    async function toggleClientStatus(clientId) {
      try {
        await fetch(`${API_BASE_URL}/api/clients/${clientId}/toggle-status`, {
          method: "PATCH",
          headers: { "Authorization": `Bearer ${authToken}` }
        });
        loadClients();
      } catch (e) {
        alert("Erro ao atualizar status na nuvem.");
      }
    }

    function openModal() {
      document.getElementById("clientForm").reset();
      document.getElementById("clientModal").classList.remove("hidden");
      safeCreateIcons();
    }

    function closeModal() {
      document.getElementById("clientModal").classList.add("hidden");
    }

    async function saveClient(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveClient");
      btn.disabled = true;
      btn.textContent = "Gravando na nuvem...";

      const payload = {
        name: document.getElementById("clientName").value.trim(),
        plan: document.getElementById("clientPlan").value,
        price: parseFloat(document.getElementById("clientPrice").value),
        due_day: parseInt(document.getElementById("clientDueDay").value, 10),
        phone: document.getElementById("clientPhone").value.replace(/\D/g, "")
      };

      try {
        const res = await fetch(`${API_BASE_URL}/api/clients`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          closeModal();
          loadClients();
        } else {
          alert("Erro ao salvar cliente na nuvem.");
        }
      } catch (err) {
        alert("Erro de conexão com o servidor.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Salvar na Nuvem";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
    });
  </script>
</body>
</html>
